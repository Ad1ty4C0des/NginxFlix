server {
    listen 80;
    server_name *.nginxflix.local nginxflix.local localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name www.nginxflix.local *.trycloudflare.com _ localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;
    error_page 502 /502.html;
    error_page 503 /503.html;

    location = /404.html { internal; }
    location = /502.html { internal; }
    location = /503.html { internal; }

    # Core Load-Balanced App (Unified Path: /app)
    location /app {
        proxy_pass http://app_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API Gateway Users
    location ~ ^/v1/users(/.*)?$ {
        rewrite ^/v1/users(/.*)?$ /users$1 break;
        proxy_pass http://user_backend;
        include /etc/nginx/snippets/cors.conf;
    }

    # API Gateway Videos
    location ~ ^/v1/videos(/.*)?$ {
        rewrite ^/v1/videos(/.*)?$ /videos$1 break;
        proxy_pass http://video_backend;
        include /etc/nginx/snippets/cors.conf;
    }

    # API Gateway Search
    location ~ ^/v1/search(/.*)?$ {
        rewrite ^/v1/search(/.*)?$ /search$1 break;
        proxy_pass http://search_backend;
        include /etc/nginx/snippets/cors.conf;
    }

    # CDN Video Streaming & Thumbnails (Unified Path: /videos)
    location ~ ^/videos(/.*)?$ {
        proxy_pass http://video_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache cdn_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "X-Cache-Status, Content-Range, Accept-Ranges" always;

        proxy_cache_bypass $http_x_cache_bypass;
        proxy_no_cache $http_x_no_cache;
        proxy_buffering on;
    }

    # WebSocket Live Chat (Unified Path: /chat)
    location /chat {
        proxy_pass http://chat_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Admin Portal (Unified Path: /admin)
    location /admin {
        proxy_pass http://app_backend/;
        proxy_set_header Host $host;
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # NGINX Telemetry
    location /nginx_status {
        stub_status on;
        access_log off;
    }

    # Static Marketing Site (Root)
    location / {
        try_files $uri $uri/ =404;
    }
}
