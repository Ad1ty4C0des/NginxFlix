server {
    listen 443 ssl;
    server_name app.nginxflix.local;

    # SSL Configuration (using the same wildcard certificate)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dedicated Logging for App Service
    access_log /var/log/nginx/app_access.log json_log;
    error_log /var/log/nginx/app_error.log warn;

    # Include Shared Security
    include /etc/nginx/snippets/security.conf;

    # Custom Error Pages (if backends are down)
    error_page 502 /502.html;
    error_page 503 /503.html;
    location = /502.html { root /usr/share/nginx/html; internal; }
    location = /503.html { root /usr/share/nginx/html; internal; }

    # General Rate Limiting
    limit_req zone=general_limit burst=50 nodelay;

    location / {
        # Forward traffic to the upstream group defined in upstream.conf
        proxy_pass http://app_backend;

        # --- Proxy Headers Passed to Express ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;

        # Return X-Request-ID back to the client browser in response headers
        add_header X-Request-ID $request_id_final always;

        # --- Timeouts ---
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # --- Buffering ---
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}