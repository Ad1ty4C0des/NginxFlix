server {
    listen 443 ssl;
    server_name cdn.nginxflix.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dedicated Logging
    access_log /var/log/nginx/cdn_access.log json_log;
    error_log /var/log/nginx/cdn_error.log warn;

    # Include Shared Security
    include /etc/nginx/snippets/security.conf;

    # --- Aggressive Caching for Video Assets & Thumbnails ---
    location ~ ^/videos(/.*)?$ {
        proxy_pass http://video_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache Zone & TTL
        proxy_cache cdn_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key "$request_uri";

        # Failover: If video-service dies, serve stale cached thumbnails instead of 502!
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

        # Inform the client of cache status and instruct browser to cache for 24h
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "X-Cache-Status, Content-Range, Accept-Ranges" always;

        # Cache Bypass & No-Cache Controls (e.g. X-Cache-Bypass: 1)
        proxy_cache_bypass $http_x_cache_bypass;
        proxy_no_cache $http_x_no_cache;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # --- General CDN Caching Proxy ---
    location / {
        proxy_pass http://video_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # General Cache TTL: Cache 200/302 for 60m, cache 404 for 1m
        proxy_cache cdn_cache;
        proxy_cache_valid 200 302 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Stale serving protection
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

        # Expose cache status: MISS, HIT, EXPIRED, STALE, BYPASS
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "X-Cache-Status, Content-Range, Accept-Ranges" always;

        # Cache Bypass & No-Cache Controls (e.g. X-Cache-Bypass: 1)
        proxy_cache_bypass $http_x_cache_bypass;
        proxy_no_cache $http_x_no_cache;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}