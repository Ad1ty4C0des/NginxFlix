upstream app_backend {
    least_conn;

    server app-1:3000 max_fails=3 fail_timeout=30s;
    server app-2:3000 max_fails=3 fail_timeout=30s;
    server app-3:3000 max_fails=3 fail_timeout=30s;
}

upstream user_backend {
    server user-service:3000 max_fails=3 fail_timeout=30s;
}

upstream video_backend {
    server video-service:3000 max_fails=3 fail_timeout=30s;
}

upstream search_backend {
    server search-service:3000 max_fails=3 fail_timeout=30s;
}

upstream api_canary {
    server user-service:3000 weight=9;
    server search-service:3000 weight=1;
}

upstream chat_backend {
    server chat-service:3000;
}