server {
    listen 443 ssl;
    server_name admin.nginxflix.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/admin_access.log json_log;
    error_log /var/log/nginx/admin_error.log warn;

    include /etc/nginx/snippets/security.conf;

    # --- IP Whitelisting (First match wins) ---
    allow 127.0.0.1;        # Localhost
    allow 172.16.0.0/12;    # Docker internal bridge network
    allow 192.168.0.0/16;   # Local LAN
    allow 10.0.0.0/8;       # Host/WSL2 network
    deny all;               # Deny everyone else

    # --- HTTP Basic Authentication ---
    auth_basic "NginxFlix Admin Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # --- Bot / Crawler User-Agent Blocking ---
    if ($http_user_agent ~* (bot|crawler|spider|scraper)) {
        return 403;
    }

    # Proxy to backend app
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $remote_user;
    }

    # --- NGINX Status Telemetry Endpoint ---
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }
}