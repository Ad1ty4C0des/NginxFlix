server {
    listen 443 ssl;
    server_name api.nginxflix.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dedicated Logging
    access_log /var/log/nginx/api_access.log json_log;
    error_log /var/log/nginx/api_error.log warn;

    # Include Shared Security
    include /etc/nginx/snippets/security.conf;

    # --- Strict Rate Limiting ---
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;

    # --- 1. Scoped Legacy Route: /watch?v=123 -> /v1/videos/123 ---
    location = /watch {
        if ($arg_v != "") {
            return 301 /v1/videos/$arg_v;
        }
        default_type application/json;
        return 404 '{"error": "Bad Request", "message": "Missing v parameter"}\n';
    }

    # --- 2. Route: /v1/users (Strict Boundary: /v1/users or /v1/users/*) ---
    location ~ ^/v1/users(/.*)?$ {
        # Includes CORS & re-declares X-Device-Type and X-Request-ID
        include /etc/nginx/snippets/cors.conf;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/cors_preflight.conf;
        }

        rewrite ^/v1/users(/.*)?$ /users$1 break;

        proxy_pass http://user_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
    }

    # --- 3. Route: /v1/videos (Strict Boundary: /v1/videos or /v1/videos/*) ---
    location ~ ^/v1/videos(/.*)?$ {
        include /etc/nginx/snippets/cors.conf;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/cors_preflight.conf;
        }

        rewrite ^/v1/videos(/.*)?$ /videos$1 break;

        proxy_pass http://video_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
    }

    # --- 4. Route: /v1/search (Strict Boundary: /v1/search or /v1/search/*) ---
    location ~ ^/v1/search(/.*)?$ {
        include /etc/nginx/snippets/cors.conf;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/cors_preflight.conf;
        }

        rewrite ^/v1/search(/.*)?$ /search$1 break;

        proxy_pass http://search_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
    }

    # --- 5. Route: /v2/ Canary Deployment ---
    location ~ ^/v2(?:/(.*))?$ {
        rewrite ^/v2(?:/(.*))?$ /$1 break;
        proxy_pass http://api_canary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_final;
        proxy_set_header X-API-Version "v2-canary";

        include /etc/nginx/snippets/cors.conf;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/cors.conf;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # --- 6. Default Catch-All: Clean JSON 404 ---
    location / {
        default_type application/json;
        return 404 '{"error": "Not Found", "message": "No API endpoint matches this path"}\n';
    }
}
