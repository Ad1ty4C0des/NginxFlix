server {
    listen 443 ssl;
    server_name ws.nginxflix.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dedicated Logging
    access_log /var/log/nginx/ws_access.log json_log;
    error_log /var/log/nginx/ws_error.log warn;

    include /etc/nginx/snippets/security.conf;

    # Connection Limiting: Max 10 simultaneous connections per IP
    limit_conn conn_limit 10;

    location / {
        proxy_pass http://chat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- WebSocket Upgrade Directives ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long read/send timeouts (prevents 60s idle disconnect)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable buffering for instantaneous real-time streaming
        proxy_buffering off;
    }
}