# API tracking headers (re-declared to prevent NGINX add_header inheritance drop)
add_header X-Device-Type $device_type always;
add_header X-Request-ID $request_id_final always;

# Universal CORS Headers
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
