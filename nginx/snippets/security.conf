# Shared security headers for HTTPS server blocks
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Dedicated Favicon Serving (suppress access logs & 404 spam across all subdomains)
location = /favicon.ico {
    root /usr/share/nginx/html;
    access_log off;
    log_not_found off;
    expires 30d;
}

location = /favicon.svg {
    root /usr/share/nginx/html;
    access_log off;
    log_not_found off;
    expires 30d;
}

# Block common exploit paths and sensitive hidden files (.env, .git, etc.)
location ~* \.(env|git|svn|htaccess|htpasswd|ds_store)$ {
    deny all;
    return 404;
}
