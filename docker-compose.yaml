services:
  nginx:
    image: nginx:alpine
    container_name: nginxflix-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app-1
      - app-2
      - app-3
      - user-service
      - video-service
      - search-service
      - chat-service
    restart: unless-stopped

  app-1:
    build: ./services/app
    container_name: nginxflix-app-1
    environment:
      - PORT=3000
      - INSTANCE_ID=app-1
    expose:
      - "3000"
    restart: unless-stopped

  app-2:
    build: ./services/app
    container_name: nginxflix-app-2
    environment:
      - PORT=3000
      - INSTANCE_ID=app-2
    expose:
      - "3000"
    restart: unless-stopped
  
  app-3:
    build: ./services/app
    container_name: nginxflix-app-3
    environment:
      - PORT=3000
      - INSTANCE_ID=app-3
    expose:
      - "3000"
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    container_name: nginxflix-user-service
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  video-service:
    build: ./services/video-service
    container_name: nginxflix-video-service
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  search-service:
    build: ./services/search-service
    container_name: nginxflix-search-service
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  chat-service:
    build: ./services/chat-service
    container_name: nginxflix-chat-service
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nginxflix-tunnel
    command: tunnel --url https://nginxflix-proxy:443 --no-tls-verify
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - tunnel
